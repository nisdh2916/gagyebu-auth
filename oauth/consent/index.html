<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>가계부 접근 허락</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main class="card">
  <h1>가계부 접근 허락</h1>

  <section id="loading"><p class="muted">불러오는 중…</p></section>

  <!-- 1) 로그인: 가계부 계정(이메일 + 비밀번호). 비밀번호는 Supabase로만 보내고 이 페이지는 저장하지 않는다. -->
  <form id="login" hidden>
    <p class="muted">먼저 가계부 계정으로 로그인하세요.</p>
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">로그인</button>
  </form>

  <!-- 2) 동의: 어떤 앱이 어떤 권한을 달라는지 보여 주고 허락/거부 -->
  <section id="consent" hidden>
    <p class="muted"><strong id="client"></strong>에서 가계부를 <strong>읽기 전용</strong>으로 보려고 해요. 내역을 바꾸거나 지울 수는 없어요.</p>
    <dl>
      <dt>계정</dt><dd id="who"></dd>
      <dt>돌아갈 주소</dt><dd id="redirect"></dd>
      <dt>권한</dt><dd id="scope"></dd>
    </dl>
    <button id="allow">허락</button>
    <button id="deny" class="secondary">거부</button>
  </section>

  <p id="error" class="error" role="alert"></p>
</main>

<script src="../../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id)
  const show = (id) => ['loading', 'login', 'consent'].forEach((x) => ($(x).hidden = x !== id))
  const fail = (msg) => { $('error').textContent = msg }

  const id = new URLSearchParams(location.search).get('authorization_id')
  if (!id) { show(null); fail('잘못된 접근이에요. Claude의 커넥터 연결 버튼에서 다시 시작하세요.'); return }

  const cfg = window.GAGYEBU_SUPABASE
  const sb = supabase.createClient(cfg.url, cfg.key)

  async function loadConsent() {
    show('loading')
    const { data: { user } } = await sb.auth.getUser()
    if (!user) { show('login'); return }
    const { data, error } = await sb.auth.oauth.getAuthorizationDetails(id)
    if (error) { show(null); fail('요청을 확인할 수 없어요: ' + error.message); return }
    // 이미 허락한 앱이면 바로 돌아간다.
    if (!data.authorization_id) { location.replace(data.redirect_url); return }
    $('client').textContent = (data.client && data.client.name) || '알 수 없는 앱'
    $('who').textContent = user.email
    $('redirect').textContent = data.redirect_uri
    $('scope').textContent = data.scope || '기본'
    show('consent')
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault(); fail('')
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value })
    $('password').value = ''
    if (error) { fail('로그인 실패: ' + error.message); return }
    loadConsent()
  })

  async function decide(approve) {
    $('allow').disabled = $('deny').disabled = true
    const { data, error } = approve
      ? await sb.auth.oauth.approveAuthorization(id)
      : await sb.auth.oauth.denyAuthorization(id)
    if (error) { $('allow').disabled = $('deny').disabled = false; fail('처리하지 못했어요: ' + error.message); return }
    location.replace(data.redirect_url)
  }
  $('allow').addEventListener('click', () => decide(true))
  $('deny').addEventListener('click', () => decide(false))

  loadConsent()
})()
</script>
</body>
</html>
